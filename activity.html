<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity &amp; Habits – CodeCanvas</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo">
        <img src="logo-placeholder.png" alt="Kaizen AI logo" class="logo-img">
      </div>
      <span class="sidebar-brand">Kaizen AI</span>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-link active">Activity &amp; Habits</a>
      <a href="#" class="nav-link">AI Insights</a>
      <a href="#" class="nav-link">Graphs</a>
      <a href="#" class="nav-link">History</a>
      <a href="#" class="nav-link">Pomodoro</a>
    </nav>

    <div class="sidebar-footer">
      <span class="streak">🔥 Streak: 5 days</span>
      <button class="btn-sign-out">Sign Out</button>
    </div>
  </aside>

  <!-- ===== Main Content ===== -->
  <main class="content">

    <h2>Activity &amp; Habits</h2>

    <!-- Two-Column Layout -->
    <div class="two-col">

      <!-- Stats Card -->
      <div class="card">
        <h3>Today's Stats</h3>
        <p class="stat-line">Habits completed: <strong>4 / 6</strong></p>
        <p class="stat-line">Current streak: <strong>5 days</strong></p>
      </div>

      <!-- History Card -->
      <div class="card">
        <h3>Recent History</h3>
        <ul class="history-list">
          <li class="history-item">
            <details>
              <summary class="history-date">March 15, 2026</summary>
              <div class="history-details">
                <p>Habits: 5 / 6</p>
              </div>
            </details>
          </li>
          <li class="history-item">
            <details>
              <summary class="history-date">March 14, 2026</summary>
              <div class="history-details">
                <p>Habits: 4 / 6</p>
              </div>
            </details>
          </li>
          <li class="history-item">
            <details>
              <summary class="history-date">March 13, 2026</summary>
              <div class="history-details">
                <p>Habits: 6 / 6</p>
              </div>
            </details>
          </li>
        </ul>
      </div>

    </div>

  </main>

</body>
</html>
